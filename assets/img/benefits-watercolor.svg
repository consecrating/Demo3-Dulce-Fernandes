<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Soft cream watercolour with blue splashes at the edges">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
    <radialGradient id="centerLight" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fefbf4" stop-opacity="1" />
      <stop offset="42%" stop-color="#fdf8ee" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#fdf8ee" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- cream base -->
  <rect width="1600" height="460" fill="#fdf8ee" />

  <!-- BLUE splashes at corners and side edges (dominant) -->
  <g filter="url(#soft)" opacity="0.8">
    <!-- corners -->
    <ellipse cx="-10" cy="-10" rx="250" ry="190" fill="#2f8faa" />
    <ellipse cx="1610" cy="-10" rx="250" ry="190" fill="#2f8faa" />
    <ellipse cx="-10" cy="470" rx="250" ry="190" fill="#227d97" />
    <ellipse cx="1610" cy="470" rx="250" ry="190" fill="#227d97" />
    <!-- side-edge blooms -->
    <ellipse cx="-30" cy="230" rx="150" ry="170" fill="#3f9cb6" />
    <ellipse cx="1630" cy="230" rx="150" ry="170" fill="#3f9cb6" />
    <!-- deeper teal touches in the corners -->
    <ellipse cx="40" cy="60" rx="120" ry="90" fill="#16566b" opacity="0.7" />
    <ellipse cx="1560" cy="400" rx="120" ry="90" fill="#16566b" opacity="0.7" />
  </g>

  <!-- lighter blue mid tones for depth -->
  <g filter="url(#soft2)" opacity="0.5">
    <ellipse cx="120" cy="380" rx="120" ry="80" fill="#7cc3d6" />
    <ellipse cx="1490" cy="90" rx="120" ry="80" fill="#7cc3d6" />
  </g>

  <!-- subtle warm accents (secondary) -->
  <g filter="url(#soft)" opacity="0.38">
    <ellipse cx="520" cy="440" rx="150" ry="70" fill="#f4cf9c" />
    <ellipse cx="1080" cy="20" rx="150" ry="70" fill="#f2bcae" />
  </g>

  <!-- fine blue splatter dots near the edges -->
  <g fill="#2f8faa" opacity="0.5">
    <circle cx="270" cy="70" r="5" /><circle cx="330" cy="45" r="3" /><circle cx="210" cy="200" r="4" />
    <circle cx="180" cy="410" r="5" /><circle cx="300" cy="430" r="3" /><circle cx="120" cy="300" r="3" />
    <circle cx="1330" cy="70" r="5" /><circle cx="1390" cy="45" r="3" /><circle cx="1410" cy="220" r="4" />
    <circle cx="1330" cy="410" r="5" /><circle cx="1280" cy="430" r="3" /><circle cx="1470" cy="300" r="3" />
  </g>

  <!-- strong light centre so the text stays readable -->
  <rect width="1600" height="460" fill="url(#centerLight)" />
</svg>
