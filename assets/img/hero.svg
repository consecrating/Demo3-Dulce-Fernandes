<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Watercolour dawn over water with soft mountains and drifting birds">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1c2e"/>
      <stop offset="0.28" stop-color="#5a3550"/>
      <stop offset="0.5" stop-color="#c76b4a"/>
      <stop offset="0.68" stop-color="#e7a35c"/>
      <stop offset="0.82" stop-color="#f3cf8f"/>
      <stop offset="1" stop-color="#f7e6c4"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7e2"/>
      <stop offset="0.4" stop-color="#ffdf9b"/>
      <stop offset="0.75" stop-color="#f2a95c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f2a95c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d79b"/>
      <stop offset="0.35" stop-color="#d99a63"/>
      <stop offset="0.7" stop-color="#6d5a6b"/>
      <stop offset="1" stop-color="#2f2436"/>
    </linearGradient>
    <linearGradient id="darkveil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#160f16"/>
      <stop offset="0.5" stop-color="#160f16" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#160f16" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer><feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="640" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="980" cy="470" r="360" fill="url(#sun)"/>
  <circle cx="980" cy="470" r="96" fill="#fff4dc"/>

  <!-- Distant mountains -->
  <path d="M0 470 L180 400 L360 452 L560 372 L760 440 L980 388 L1220 452 L1420 402 L1600 448 L1600 640 L0 640 Z" fill="#7a5f7e" opacity="0.55" filter="url(#soft)"/>
  <path d="M0 500 L240 450 L520 496 L820 436 L1120 500 L1400 456 L1600 496 L1600 640 L0 640 Z" fill="#5b4560" opacity="0.7"/>

  <!-- Water -->
  <rect y="620" width="1600" height="380" fill="url(#water)"/>
  <!-- Sun reflection on water -->
  <g opacity="0.55" fill="#ffe6b0">
    <rect x="905" y="650" width="150" height="10" rx="5"/>
    <rect x="880" y="690" width="200" height="12" rx="6"/>
    <rect x="900" y="738" width="160" height="10" rx="5"/>
    <rect x="860" y="790" width="240" height="14" rx="7"/>
    <rect x="890" y="852" width="180" height="12" rx="6"/>
  </g>
  <!-- Water ripples -->
  <g stroke="#3a2c3e" stroke-width="3" opacity="0.35" fill="none">
    <path d="M0 700 Q400 688 800 700 T1600 700"/>
    <path d="M0 760 Q400 748 800 760 T1600 760"/>
    <path d="M0 830 Q400 818 800 830 T1600 830"/>
    <path d="M0 910 Q400 898 800 910 T1600 910"/>
  </g>

  <!-- Golden thread arc (signature of original) -->
  <path d="M120 900 Q220 260 760 150 Q1180 70 1360 260" fill="none" stroke="#e6c882" stroke-width="2.5" opacity="0.8"/>
  <path d="M60 620 Q140 400 300 320" fill="none" stroke="#e6c882" stroke-width="1.6" opacity="0.6"/>

  <!-- Drifting birds -->
  <g stroke="#3a2a1e" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M1160 190 q26 -22 52 0 q26 -22 52 0"/>
    <path d="M1250 150 q22 -18 44 0 q22 -18 44 0"/>
    <path d="M1210 240 q18 -15 36 0 q18 -15 36 0"/>
  </g>

  <!-- Foliage accents lower right -->
  <g opacity="0.92">
    <path d="M1600 1000 C1500 900 1470 760 1520 640 C1560 720 1580 860 1600 940 Z" fill="#2f5d63"/>
    <path d="M1560 1000 C1470 920 1420 800 1440 700 C1500 780 1540 900 1600 970 Z" fill="#3c7075" opacity="0.8"/>
    <path d="M1420 1000 C1360 900 1360 800 1420 720 C1440 820 1440 920 1480 1000 Z" fill="#c76b4a" opacity="0.7"/>
  </g>

  <!-- Left dark veil for text legibility -->
  <rect width="900" height="1000" fill="url(#darkveil)"/>

  <!-- Paper grain -->
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.6"/>
</svg>
